syntax = "proto3";

import "google/protobuf/empty.proto";

package scheduler;

// Global Scheduler service for distributed task assignment
// Runs on Primary machine - Secondary connects via gRPC
service Scheduler {
  // Worker acquires next task from the scheduler
  rpc AcquireTask(AcquireTaskRequest) returns (AcquireTaskResponse);
  
  // Worker reports a completed proof
  rpc ReportProof(ReportProofRequest) returns (ReportProofResponse);
  
  // Primary registers chunk during emulation (only called by Primary's emulator)
  rpc RegisterChunk(RegisterChunkRequest) returns (google.protobuf.Empty);
  
  // Mark emulation as finalized
  rpc FinalizeEmulation(google.protobuf.Empty) returns (google.protobuf.Empty);
  
  // Check if all work is complete
  rpc CheckComplete(google.protobuf.Empty) returns (CheckCompleteResponse);


  // Secondary blocks until Primary stores the next block input (zero-delay)
  rpc WaitForNextBlockInput(google.protobuf.Empty) returns (WaitForNextBlockInputResponse);

  // The global LogUp of a block proved on two machines (MLE). A chunk's convert leaf enters a
  // hash chain over the Global table commitments of the chunks before it, whichever machine
  // traced them: the primary gathers every chunk's commitment and the secondary follows it.
  // All three refuse a block the primary is not on with FAILED_PRECONDITION.

  // Secondary reports the Global table commitment of a chunk it traced, with the chunk's share
  // of the block's real-row count.
  rpc ReportChunkTable(ReportChunkTableRequest) returns (google.protobuf.Empty);

  // Secondary long-polls for the commitments the primary holds from a chunk on, in chunk order
  // without a gap.
  rpc AwaitChunkTables(AwaitChunkTablesRequest) returns (AwaitChunkTablesResponse);

  // Secondary hands in the node over a group of its chunks' tables; the primary reduces it
  // with its own into the tree's prefix.
  rpc ReportGroupNode(ReportGroupNodeRequest) returns (google.protobuf.Empty);
}

// Request to acquire a task
message AcquireTaskRequest {
  string worker_id = 1;
  // Block number the worker is currently working on
  uint64 block_num = 2;
}

// Response containing the assigned task
message AcquireTaskResponse {
  oneof task {
    ChunkProofTask chunk_task = 1;
    CombineProofTask combine_task = 2;
    WaitTask wait_task = 3;
    CompleteTask complete_task = 4;
  }
  // Set of chunk indices that have been proven globally.
  // Consumers use this to clean up RecordStore entries for chunks
  // that have already been consumed and proven by some machine.
  repeated uint64 proven_chunks = 5;
}

// Task: generate proof for a single chunk
message ChunkProofTask {
  uint64 chunk_idx = 1;
}

// Task: combine two adjacent proofs
message CombineProofTask {
  bytes left_proof_data = 1;
  uint64 left_start = 2;
  uint64 left_end = 3;
  bytes right_proof_data = 4;
  uint64 right_start = 5;
  uint64 right_end = 6;
}

// No tasks available - wait and retry
message WaitTask {}

// All work complete
message CompleteTask {}

// Request to report a completed proof
message ReportProofRequest {
  string worker_id = 1;
  uint64 start_chunk = 2;
  uint64 end_chunk = 3;
  bytes proof_data = 4;
  // If true, scheduler will NOT queue the generated combine task, 
  // but return it in response for local execution
  bool keep_local = 5;
}

// Response after reporting proof
message ReportProofResponse {
}

// Request to register a chunk during emulation
message RegisterChunkRequest {
  uint64 chunk_idx = 1;
}

// Check completion response
message CheckCompleteResponse {
  bool completed = 1;
  // Final proof data if completed
  bytes final_proof_data = 2;
  // Block number that was completed
  uint64 completed_block = 3;
}


// Response for WaitForNextBlockInput (blocking RPC)
message WaitForNextBlockInputResponse {
  uint64 block_number = 1;
  bytes input_data = 2;
}

// A chunk's Global table commitment, from the machine that traced the chunk
message ReportChunkTableRequest {
  // Block the sender is working on
  uint64 block_num = 1;
  uint64 chunk_idx = 2;
  // The commitment, bincode-serialised (opaque to the scheduler service)
  bytes commit = 3;
  // The chunk's share of the block's real-row count
  uint64 row_count = 4;
}

message AwaitChunkTablesRequest {
  // Block the sender is working on
  uint64 block_num = 1;
  // The first chunk whose commitment the sender lacks
  uint64 from_chunk = 2;
}

message AwaitChunkTablesResponse {
  // Commitments of chunks from_chunk, from_chunk + 1, ..., as in ReportChunkTableRequest;
  // empty if none came within the wait
  repeated bytes commits = 1;
  // Whether the primary's emulation is finalized, and the block's chunk count if so
  bool chunks_known = 2;
  uint64 chunks = 3;
}

// The node over a group of consecutive chunks' Global tables
message ReportGroupNodeRequest {
  // Block the sender is working on
  uint64 block_num = 1;
  // The group's first chunk, and how many chunks it covers
  uint64 first_chunk = 2;
  uint64 chunks = 3;
  // The node's proof, bincode-serialised like ReportProofRequest.proof_data
  bytes proof_data = 4;
}
