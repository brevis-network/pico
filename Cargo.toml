[workspace]
members = ["derive", "mle-core", "mle-cpu", "cuda-mle", "vm", "aot-codegen", "aot-runtime", "sdk/*", "gnark/field-ffi", "perf", "distributed-vm", "gpu-api"]
# `cuda-mle` and `gpu-api` need a CUDA toolkit; they build only through `pico-vm/cuda`.
default-members = ["derive", "mle-core", "mle-cpu", "vm", "aot-codegen", "aot-runtime", "sdk/*", "gnark/field-ffi", "perf", "distributed-vm"]
resolver = "2"

[workspace.package]
version = "3.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["zkvm", "plonky3", "stark", "whir"]
categories = ["cryptography"]
repository = "https://github.com/brevis-network/pico"


[profile.flamegraph]                # Custom profile for flamegraph generation
inherits = "release"                # Inherit all settings from the 'release' profile
debug = true                        # Enable full debug info (DWARF) for symbol resolution
split-debuginfo = "unpacked"        # On macOS, place DWARF info next to binary (for browser UI like pprof/speedscope)
codegen-units = 1                   # Merge all codegen units for more coherent stack traces
lto = "off"                         # Disable Link Time Optimization to avoid symbol folding across crates
incremental = false                 # Disable incremental compilation to ensure reproducibility
strip = "none"                      # Prevent release build from stripping debug symbol

# Run the benchmarks in perf folder.
[profile.perf]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
#debug = "limited"
strip = "none"

[profile.fast]
inherits = "release"
debug = true
debug-assertions = true

[workspace.dependencies]
pico-derive = { path = "derive" }
pico-vm = { path = "vm" }
pico-aot-runtime = { path = "aot-runtime" }
pico-aot-codegen = { path = "aot-codegen" }
pico-sdk = { path = "sdk/sdk" }
pico-cli = { path = "sdk/cli" }
pico-patch-libs = { path = "sdk/patch-libs" }
pico-perf = { path = "perf" }
pico-gpu-api = { path = "gpu-api" }

