[package]
name = "pico-aot-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
# TODO(onchain): back to `pico-vm = { workspace = true, features = ["aot-emulator"] }` once
# `multi-field-transcript` is unconditional. Until then `workspace = true` brings `pico-vm`'s
# defaults, that feature among them, into every build that takes this crate, even one built with
# `--no-default-features`. `rayon` and `strict` because `pico-vm` without `rayon` fails clippy.
pico-vm = { path = "../vm", default-features = false, features = ["aot-emulator", "rayon", "strict"] }
hashbrown = { workspace = true }
pico-aot-pure.workspace = true
p3-koala-bear = { workspace = true }
log = { workspace = true }
tiny-keccak.workspace = true
p3-field.workspace = true
p3-symmetric.workspace = true
typenum.workspace = true
hybrid-array.workspace = true
num.workspace = true
p256.workspace = true
halo2curves.workspace = true
bls12_381.workspace = true
# AOT precompile backends.
ark-ff = "0.5"
ark-secp256k1 = "0.5"
ark-bn254 = "0.5"
ark-bls12-381 = "0.5"


[features]
bigint-rug = ["pico-vm/bigint-rug"]
mmap-memory = ["pico-vm/mmap-memory"]
# A checking build, for gates and never for timing: every step a recording block writes directly is
# also closed by the shared writer's generic code, and the run panics where the two layouts differ
# or an instruction constant is not the program's at its pc. Both see the same values, so a value
# wrong yet consistent across the step passes; only comparing with the interpreter catches that.
recorder-check = ["pico-vm/test-utils"]
