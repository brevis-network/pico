[workspace]
members = [
    "common",
    "patches/tiny-keccak/*",
    "patches/sha2/*",
    "patches/sha3/*",
    "patches/curve25519-dalek/*",
    "patches/bls12-381/*",
    "patches/curve25519-dalek-ng/*",
    "patches/ed25519-consensus/*",
    "patches/ecdsa-core/*",
    "patches/secp256k1/*",
    "patches/substate-bn/*",
    "patches/bigint/*",
    "patches/poseidon2/*",
    "patches/coprocessor/*",
    # Guests for the host prover's own tests, not patch cases: `test_patches` runs `patches/` only.
    "guests/*",
]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["zkvm", "plonky3", "stark", "whir"]
categories = ["cryptography"]

# The patched crates depend on `pico-patch-libs` from the public pico repo; redirect it at this
# workspace's copy, as `perf/bench_apps/Cargo.toml` does.
#
# Cargo matches a patch by the repository URL, so it also reaches the deps that pin
# `branch = "rv64"` (`bls12_381`, `substrate-bn`, `k256` and one `curve25519-dalek-ng`) once the
# lock is resolved afresh: every crate here then builds against this workspace's copy.
#
# Each app pins its fork by `rev`, with the branch it came from beside it. The branch sources
# still in `Cargo.lock` are named by the forks' own manifests, and cargo refuses a patch that
# points a git source at another revision of the same repository, so only the lock fixes those.
[patch."https://github.com/brevis-network/pico"]
pico-patch-libs = { path = "../../../sdk/patch-libs" }

[workspace.dependencies]
pico-sdk = { path = "../../../sdk/sdk" }
pico-prover = { path = "../../../sdk/prover" }
pico-vm = { path = "../.." }
alloy-sol-types = "0.8.19"
bincode = "1.3.3"
serde = "1.0"
