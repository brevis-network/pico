[package]
name = "pico-prover"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
# TODO(onchain): back to `pico-vm.workspace = true` once `multi-field-transcript` is unconditional.
pico-vm = { path = "../../vm", default-features = false, features = ["rayon", "strict"] }
# The protocol core, for the proof codec and the verifying-key type a stored proof carries.
# `default-features = false` mirrors `vm/Cargo.toml`: `parallel` reaches it through `pico-vm`.
pico-mle-core = { path = "../../mle-core", default-features = false }
# The committed-value binding is the stable verifier's, so the two cannot disagree.
pico-verifier = { workspace = true, features = ["codec"] }
# The AOT program registry, for `aot`.
pico-aot-runtime = { path = "../../aot-runtime", default-features = false, optional = true }
# The multi-card GPU pipeline, for `cuda`.
distributed-vm = { path = "../../distributed-vm", optional = true }

bincode.workspace = true
serde = { workspace = true, features = ["derive"] }
# Declared here rather than in the workspace table, as `pico-sdk` does: the guest accumulates the
# committed-value digest with the same crate, and the two have to agree.
sha2 = "0.10.8"
thiserror.workspace = true

[features]
default = ["multi-field-transcript"]
# Forwards to `pico-vm`'s. On by default, so every build reaches the on-chain proof. Off
# (`default-features = false`) builds without the embed and wrap machines: `Phase::Embed` and
# `Phase::Wrap` are then named but unimplemented, and return `ProveError::FeatureMissing`.
multi-field-transcript = ["pico-vm/multi-field-transcript"]
# Emulates through the snapshot pipeline with a guest's AOT-compiled code: `ProverBuilder::aot`.
aot = ["pico-vm/aot-emulator", "dep:pico-aot-runtime"]
# Proves on the GPU only: a whitelist-mode `Phase::Combine` on every visible card through
# `distributed-vm`, other modes and phases on card 0, since `pico-vm/cuda` swaps the proving engine
# process-wide. Emulation and `execute` stay on the CPU. Needs the CUDA Toolkit and an NVIDIA GPU.
cuda = ["pico-vm/cuda", "dep:distributed-vm", "distributed-vm/cuda"]
