[package]
name = "pico-sdk"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
keywords = { workspace = true }
categories = { workspace = true }

[dependencies]
bincode.workspace = true
serde.workspace = true
anyhow.workspace = true
p3-challenger.workspace = true
p3-field.workspace = true
p3-koala-bear.workspace = true
p3-symmetric.workspace = true
pico-patch-libs.workspace = true
cfg-if.workspace = true
rand.workspace = true
lazy_static.workspace = true
getrandom = { version = "0.2.15", features = ["custom"] }
# Reached through p3's `rand`; needs its own backend, registered differently from 0.2.
getrandom_v04 = { package = "getrandom", version = "0.4" }
libm = { version = "0.2.8", optional = true }
sha2 = { version = "0.10.8", features = ["compress"] }
# The zkCoprocessor input commitment is a Poseidon2 Merkle root computed through
# `syscall_poseidon2_permute`. That repository's `main` predates the syscall's alignment and
# canonicality checks; this revision, on its `pico-3.0-rv64` branch, hands it 8-byte-aligned
# states of canonical KoalaBear words. A `rev` rather than the branch: a lock pins either, but a
# crate that depends on this one resolves it without our lock, and would take whatever the branch
# held that day -- the input commitment its guest produces included.
coprocessor-sdk = { git = "https://github.com/brevis-network/Pico-zkCoprocessor", rev = "0c5a781fd0bc73f2706748a04d4cccf167a19654", optional = true }
# The `zkvm_*` accelerators (`zkvm_accelerators`). The curve crates are Pico's patched forks, the
# ones rsp uses: inside the zkVM they reach the curve and field syscalls.
aurora-engine-modexp = { version = "1.2.0", default-features = false }
bls12_381 = { git = "https://github.com/brevis-network/bls12_381", rev = "5dbe03feec550084e0a5c6efd8e3c502e2a62c43", default-features = false, features = ["groups", "pairings", "alloc", "experimental"] } # brevis-network/bls12_381#2 (feat/1801-g2-msm)
k256 = { git = "https://github.com/brevis-network/elliptic-curves", rev = "d0c56392e728fd0df321820fb0cb495272d38673", default-features = false, features = ["ecdsa", "alloc"] } # k256-0.13.4-rv64
p256 = { git = "https://github.com/brevis-network/elliptic-curves", rev = "94ffb195ad1d91a0d6678dfbc3432f83e25162b4", default-features = false, features = ["ecdsa", "alloc"] } # p256-0.13.2-rv64
ripemd = { version = "0.1.3", default-features = false }
substrate-bn = { git = "https://github.com/brevis-network/bn", rev = "1455d63953ba9f7231043c57c7077cee6a10dc89" } # patch-v1.0.2-rv64
hex.workspace = true
serde_json.workspace = true
# `init_logger`, a host program's: behind `logger` so a guest that turns it off locks none of it.
tracing = { workspace = true, optional = true }
tracing-forest = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }

[target.'cfg(not(target_os = "zkvm"))'.dependencies]
# Only for `prover`'s allocator: a lockfile lists every target's dependencies, so a non-optional
# host dependency here would put the whole prover in a guest's lock.
# TODO(onchain): back to `pico-vm.workspace = true` once `multi-field-transcript` is unconditional.
pico-vm = { path = "../../vm", default-features = false, features = ["rayon", "strict"], optional = true }
# The Keccak permutation the accelerators run on the host, where there is no syscall.
keccak = "0.1.5"

[dev-dependencies]
# The host values the SDK's constants are checked against.
pico-vm = { path = "../../vm", default-features = false, features = ["rayon", "strict"] }

[features]
default = ["logger"]
# `init_logger`. A guest can turn it off with `default-features = false`.
logger = ["dep:tracing", "dep:tracing-forest", "dep:tracing-subscriber"]
prover = ["dep:pico-vm", "pico-vm/jemalloc"]
libm = ["dep:libm"]
coprocessor = ["dep:coprocessor-sdk"]
# `memmove`, `memcmp`, `bcmp` and `strlen` from the runtime, for a build without
# `compiler-builtins-mem`: the static library (`cargo pico lib`).
c-memory-functions = []
# No-op: KoalaBear is the only field. Kept so guests that still select it keep building.
kb = []
