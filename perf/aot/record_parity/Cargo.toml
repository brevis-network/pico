[package]
name = "aot-record-parity"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
pico-vm = { path = "../../../vm", features = ["aot-emulator", "stage-ledger"] }
pico-aot-runtime = { path = "../../../aot-runtime" }
pico-aot-dispatch = { path = "../../../aot-generated" }
bincode = "1.3"
serde = "1.0"
serde_json = "1.0.121"
sha2 = "0.10.8"

[features]
# The checking build of the recording blocks (`record_parity.sh -c`): every row a block writes
# directly is checked against the shared writer's generic close as it is written.
recorder-check = ["pico-aot-runtime/recorder-check"]
