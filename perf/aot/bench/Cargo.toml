[package]
name = "aot-bench"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = false

[dependencies]
pico-vm = { path = "../../../vm", features = ["aot-emulator"] }
pico-aot-runtime = { path = "../../../aot-runtime" }
pico-aot-dispatch = { path = "../../../aot-generated" }
pico-prover = { path = "../../../sdk/prover", features = ["aot"] }
# For `init_logger`, so the prover logs as it does under `cargo pico`.
pico-sdk = { path = "../../../sdk/sdk" }
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
# The history census's capacity table.
serde_json = "1.0"
sha2 = "0.10.8"
# `getrusage`: an emulation arm's minor page faults, and `replay-chunk`'s per replay
# (`RUSAGE_THREAD`, Linux only).
libc = "0.2"

[features]
default = ["jemalloc", "stage-ledger"]
# The allocator a user's prover build gets, through `pico-sdk/prover` or `cargo pico`.
jemalloc = ["pico-vm/jemalloc"]
# The allocator `single_node_mle.sh` and `ethproofs_single_node_mle.sh` build with; it wins over
# jemalloc when both are on.
tcmalloc = ["pico-vm/tcmalloc"]
# The guest memory backing those scripts build with, for both emulators.
mmap-memory = ["pico-vm/mmap-memory", "pico-aot-dispatch/mmap-memory"]
# The big-integer backend of the curve precompiles those scripts build with, for both emulators.
bigint-rug = ["pico-vm/bigint-rug", "pico-aot-dispatch/bigint-rug"]
# The ledger and span CSV `aot_bench.sh` writes. Without it (`--no-default-features --features
# jemalloc`) the instruments compile out as they do in a shipped build, for an arm that measures
# what they cost.
stage-ledger = ["pico-vm/stage-ledger"]
# The checking build of the recording blocks (`aot_bench.sh -C`): every row a block writes
# directly is checked against the shared writer's generic close as it is written. Never for timing.
recorder-check = ["pico-aot-runtime/recorder-check"]
# The device round trip of the arena arm, on a card.
cuda = ["pico-vm/cuda"]
