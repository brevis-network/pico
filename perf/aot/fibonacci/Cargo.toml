[package]
name = "manual-aot"
version = "0.1.0"
edition = "2021"

[lib]
name = "aot"
path = "src/lib.rs"

[dependencies]
# Core Pico types.
pico-vm = { path = "../../../vm" }
pico-aot-dispatch = { path = "../../../aot-generated", optional = true }
pico-aot-runtime = { path = "../../../aot-runtime", optional = true }
aot-common = { path = "../aot_common", features = [] }

# Convenience
hashbrown = { version = "0.14.5", features = ["serde", "inline-more"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

[[bin]]
name = "run"
path = "src/bin/run.rs"

[[bin]]
name = "pipeline_bench"
path = "src/bin/pipeline_bench.rs"

[dev-dependencies]
# Same source as the root workspace: a second `cudart` would be a second type, and the pool it
# hands flags to lives in pico-vm.
cudart = { git = "https://github.com/brevis-network/era-cuda.git", rev = "4277a3558fce68b5ae48bc80055046bb1d0d6ed4" }
p3-koala-bear = { git = "https://github.com/brevis-network/Plonky3.git", rev = "da6ca12c" }

[features]
default = ["aot"]
aot = ["pico-aot-dispatch", "pico-aot-runtime", "aot-common/aot"]
bigint-rug = ["pico-vm/bigint-rug", "pico-aot-dispatch/bigint-rug"]
mmap-memory = ["pico-vm/mmap-memory", "pico-aot-dispatch/mmap-memory"]
