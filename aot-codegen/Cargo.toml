[package]
name = "pico-aot-codegen"
version = "0.1.0"
edition = "2021"

[dependencies]
syn = { version = "2.0", features = [
    "full",
    "extra-traits",
    "visit",
    "visit-mut",
] }
quote = "1.0"
prettyplease = "0.2"
proc-macro2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.8"
elf.workspace = true
# Only the RISC-V front end. Not `workspace = true`: that brings `pico-vm`'s defaults,
# `multi-field-transcript` among them, into every build that takes this crate, even one built with
# `--no-default-features`. `rayon` and `strict` because `pico-vm` without `rayon` fails clippy.
pico-vm = { path = "../vm", default-features = false, features = ["rayon", "strict"] }
