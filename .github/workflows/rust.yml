on:
    # `gpu-*` and not `gpu-*-*`: the GPU line's branch, whatever the repository calls it, and not
    # the feature branches named after it.
    pull_request:
        branches:
            - gpu
            - "gpu-*"
            - "!gpu-*-*"
            - release/v*
        paths-ignore:
            - "docs/**"
            - "README.md"
            - ".gitignore"
            - "Makefile"
            - "tools/**"
            - "scripts/**"
            - ".claude/**"
            - ".agent/**"
            # Data-only bench blobs (ELF/bins) can't affect clippy/fmt; skip CI when a
            # PR touches nothing else (mixed code+data PRs still run — paths-ignore only
            # skips when EVERY changed file matches).
            - "perf/bench_data/**"
    push:
        branches:
            # Cache scoping: a run may only read caches from its own ref, its base
            # branch, or the default branch. Without a push trigger on the branch PRs
            # here target, no shared cache ever exists for them and every new PR's first
            # run starts cold.
            - gpu
            - "gpu-*"
            - "!gpu-*-*"
        paths-ignore:
            - "docs/**"
            - "README.md"
            - ".gitignore"
            - "Makefile"
            - "tools/**"
            - "scripts/**"
            - ".claude/**"
            - ".agent/**"
            # Data-only bench blobs (ELF/bins) can't affect clippy/fmt; skip CI when a
            # PR touches nothing else (mixed code+data PRs still run — paths-ignore only
            # skips when EVERY changed file matches).
            - "perf/bench_data/**"
    # So a run can be retried after an infrastructure failure -- the apt rate-limiting inside the
    # CUDA container noted in the lint job is the usual cause -- without pushing an empty commit.
    workflow_dispatch:

name: Check, Test, and Format

# This workflow only reads the repo, and every dependency is public, so it needs no secret.
# Declared rather than inheriting a repository default that may be write.
permissions:
    contents: read

# Cancel a superseded run when a new commit is pushed to the same branch/PR,
# so a re-push doesn't leave the old ~24min GPU-lint run burning a runner.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# No job runs the emulator: its event buffers are CUDA pinned memory, so executing or proving a
# program needs a GPU, which these runners do not have. Proofs are checked on GPU hosts.
env:
    VK_VERIFICATION: false

jobs:
    fmt:
        name: GPU · Format
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust
              run: |
                  rustup toolchain install nightly-2026-09-27 --profile minimal --component rustfmt
                  rustup override set nightly-2026-09-27
            # Five workspace roots live here and `--all` only ever sees the one it is run
            # from, so the other four rotted unnoticed. Each is checked from its own root.
            - name: Format
              run: |
                  set -eux
                  cargo fmt --all -- --check
                  for w in examples perf/aot perf/bench_apps vm/examples/patch-testing; do
                    (cd "$w" && cargo fmt --all -- --check)
                  done
            # The two satellite workspaces with a committed lock: `--locked` resolves, which is
            # the only way to see a lock that no longer matches its manifests.
            - name: Satellite workspace locks resolve
              run: |
                  set -eux
                  for w in perf/bench_apps vm/examples/patch-testing; do
                    (cd "$w" && cargo metadata --locked --format-version 1 > /dev/null)
                  done

    lint-gpu:
        name: GPU · CUDA build, AOT codegen and clippy
        runs-on: ubuntu-latest
        container:
            image: nvidia/cuda:12.3.1-devel-ubuntu22.04
        env:
            DEBIAN_FRONTEND: noninteractive
            # build.rs respects empty GPU_TARGET_ARCHS → JIT path, which skips
            # arch-specific codegen we don't need for linting on a GPU-less runner.
            GPU_TARGET_ARCHS: ""
            # This job builds in the dev profile so the AOT-generation step can share one
            # target dir with clippy, and dev debuginfo for a workspace this size is tens of
            # GB — enough to exhaust the runner while archiving pico-vm's rlib. Nothing here
            # is debugged, so drop it. Set as job env rather than in `[profile.dev]` so
            # local development keeps its debuginfo.
            CARGO_PROFILE_DEV_DEBUG: "0"
        steps:
            # This job runs out of disk, so report the budget instead of guessing at it. Two
            # things were already ruled out by measurement: the usual runner-image trick
            # (/usr/share/dotnet, /usr/local/lib/android, $AGENT_TOOLSDIRECTORY) cannot help,
            # because those are host paths and every step here runs inside the container; and
            # deleting the CUDA image's Nsight profilers and doc trees freed exactly 0 of the
            # 8 GB that were available at job start. Whatever is holding the other 64 GB is
            # what a future fix has to target, so print it rather than delete blind.
            - name: Report disk budget
              run: |
                  df -h /
                  du -sh /usr/local/cuda* /github/home /__w 2>/dev/null | sort -h | tail -8 || true

            - name: Install apt deps
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends \
                    curl unzip ca-certificates build-essential pkg-config libssl-dev \
                    cmake git openssh-client llvm-dev libclang-dev g++-11 \
                    binutils m4 file google-perftools libgoogle-perftools-dev
                  rm -rf /var/lib/apt/lists/*

            # Install protoc from the official release so tonic-build finds
            # google/protobuf/*.proto under /usr/local/include. The apt
            # protobuf-compiler package omits those includes.
            - name: Install protoc (official release)
              run: |
                  curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v21.12/protoc-21.12-linux-x86_64.zip
                  unzip -o protoc-21.12-linux-x86_64.zip -d /usr/local
                  rm protoc-21.12-linux-x86_64.zip

            # --all-features activates pico-vm's tcmalloc feature, whose tcmalloc
            # crate looks for libtcmalloc.so (the apt package only ships .so.4).
            - name: Symlink libtcmalloc.so
              run: |
                  ln -sf /usr/lib/x86_64-linux-gnu/libtcmalloc.so.4 /usr/lib/x86_64-linux-gnu/libtcmalloc.so

            - name: Configure git
              run: |
                  git config --global --add safe.directory '*'

            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              run: |
                  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none
                  . "$HOME/.cargo/env"
                  rustup toolchain install nightly-2026-09-27 --profile minimal --component clippy
                  rustup override set nightly-2026-09-27
                  echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

            - uses: Swatinem/rust-cache@v2
              with:
                  prefix-key: "v1-cuda12.3"
                  # Each entry is ~940MB against a 10GB repo quota, and a PR-scoped
                  # cache is unreadable from any other PR. Saving on PR refs therefore
                  # stores the same content many times over and evicts the branch cache
                  # that every PR could have shared. Save only on the branches whose
                  # caches are actually visible downstream: the pushes this workflow runs on.
                  save-if: ${{ github.event_name == 'push' }}

            # The CUDA objects are keyed on their sources, but a miss is cheap rather
            # than fatal: restore-keys pull the newest batch we have, and the build
            # script re-fingerprints every source against nvcc's own dependency list,
            # so it rebuilds exactly what changed and reuses the rest. That also means
            # the globs below only have to be roughly right — correctness comes from
            # the fingerprints, not from this key.
            - name: Cache CUDA objects
              uses: actions/cache@v4
              with:
                  path: target/cuda-objs
                  # pico-gpu's sources enter through the revision Cargo.lock pins.
                  key: cuda-objs-v2-${{ hashFiles('gpu-api/cuda/**', 'Cargo.lock') }}
                  restore-keys: |
                      cuda-objs-v1-

            # aot-generated/ is a path dependency of distributed-vm living inside the
            # workspace directory, so Cargo makes it (and, once generated, its chunk
            # crates) an automatic workspace member that `--workspace` lints. That
            # compile check is the reason this generation runs at all — but building the
            # generator costs ~10min to produce crates that take ~10s to check, so cache
            # the output instead.
            #
            # The generated code is a function of the ELF and the generator, and
            # elf_parser.rs decodes through pico-vm's RISC-V frontend, so the key must
            # cover that frontend too. No restore-keys: a prefix fallback would restore
            # arbitrary stale output and silently weaken the check.
            #
            # Restore and save are separate so that saving is visibly conditional. The
            # generator wipes aot-generated/ up front (compiler.rs remove_dir_all) and
            # only writes the dispatch manifest at the end, so a crash in between leaves
            # a directory that has chunks but no Cargo.toml. Caching that would make the
            # assertion below fail on every later run under an unchanged key. The save
            # must therefore never run on a failed job, and stating it here beats relying
            # on the combined action's internal `post-if`.
            #
            # One key expression, referenced twice: if restore and save could drift apart
            # the cache would simply stop ever being hit, with nothing to notice it.
            - name: Compute the AOT cache key
              id: aot-key
              run: |
                  echo "key=aot-v1-${{ hashFiles('perf/bench_data/rv64/fib-elf', 'aot-codegen/**', 'vm/src/compiler/riscv/**') }}" >> "$GITHUB_OUTPUT"

            - name: Restore generated AOT crates
              id: aot-cache
              uses: actions/cache/restore@v4
              with:
                  path: aot-generated
                  key: ${{ steps.aot-key.outputs.key }}

            # Overwrites the bootstrap stub with the real pico-aot-dispatch manifest and
            # its chunk crates. Runs in the dev profile so it shares one target dir (and
            # therefore one CUDA build) with the clippy steps below; the binary itself
            # runs in well under a second, so an optimized build buys nothing.
            - name: Generate AOT crates (fib-elf)
              if: steps.aot-cache.outputs.cache-hit != 'true'
              run: |
                  cargo run -p pico-aot-codegen --bin generate_crates -- perf/bench_data/rv64/fib-elf

            # Fails fast if aot-generated/ is still the bootstrap stub — otherwise clippy
            # would pass while silently linting nothing. The manifest check is the load-
            # bearing one: chunk crates only become workspace members, and thus only get
            # checked, if the dispatch manifest lists them as path dependencies.
            - name: Assert generated AOT crates are real, not the stub
              run: |
                  set -eux
                  grep -q 'pico-aot-chunk' aot-generated/Cargo.toml
                  ls aot-generated/chunks | grep -q chunk_

            # Only after the assertion has vouched for the directory. `success()` is
            # spelled out because any `if:` replaces the implicit success gate, and
            # skipping on a hit avoids the "cache already exists" warning.
            - name: Save generated AOT crates
              if: success() && steps.aot-cache.outputs.cache-hit != 'true'
              uses: actions/cache/save@v4
              with:
                  path: aot-generated
                  key: ${{ steps.aot-key.outputs.key }}

            # Lint libs only; tests/examples/benches still have API drift.
            # Cap lints at warn (vm's `strict` feature enables deny(warnings));
            # --all-features avoided: tcmalloc + jemalloc both register #[global_allocator].
            # cuda-mle is excluded: its build.rs detects the GPU arch via nvidia-smi, which this
            # GPU-less container lacks; it is built + linked manually on a GPU host.
            - name: Clippy (workspace libs, default features, exclude pico-sdk + cuda-mle)
              run: |
                  cargo clippy --workspace --lib --exclude pico-sdk --exclude cuda-mle \
                    --message-format=short -- --cap-lints=warn

            # The lint above is --lib only, so the generate_crates binary goes unchecked
            # whenever the cache hit skips running it. Capped at warn, this is effectively
            # a compile check — which is the signal that would otherwise be lost.
            - name: Clippy pico-aot-codegen binaries
              run: |
                  cargo clippy -p pico-aot-codegen --bins \
                    --message-format=short -- --cap-lints=warn

            # Same reason as above, for pico-vm's own binary: --lib never compiles it, so
            # without this it can stop building and nothing says so.
            - name: Clippy pico-vm binaries
              run: |
                  cargo clippy -p pico-vm --bins \
                    --message-format=short -- --cap-lints=warn

            # No step above runs a test, and none of these needs a GPU. Dev profile, so they share
            # the target dir the AOT generation already built pico-vm into.
            - name: Constraint-surface parity
              run: |
                  # The pinned dump is shared with the CPU line; without this step a chip change
                  # here lands green against a dump only the other line checks.
                  cargo test -p pico-vm --test riscv_constraint_parity
            - name: Precompile support pins
              run: |
                  cargo test -p pico-vm --test precompile_support

            # `perf/aot` is a separate workspace, so nothing above compiles its Rust at all —
            # which is how its AOT harnesses drifted through several API changes unnoticed.
            #
            # `perf/aot/target` is a second target dir that nothing caches, and the note at the
            # top of this job says disk is what runs out here, so drop it again on the way past.
            - name: AOT harnesses compile
              run: |
                  set -eux
                  (cd perf/aot && cargo check --all-targets)
                  rm -rf perf/aot/target

            # `pico-perf`'s AOT factory glue. The lint above runs on default features, and `aot`
            # is not one of them, so nothing else compiles this file.
            - name: AOT glue compiles
              run: |
                  cargo check -p pico-perf --features aot

            # pico-sdk is excluded from the workspace lint above and linted on its own with its
            # prover feature, which still needs the CUDA toolchain (pico-vm → cudart-sys).
            - name: Clippy pico-sdk
              run: |
                  cargo clippy -p pico-sdk --features prover,libm \
                    --locked --message-format=short -- -D warnings

            # The host prover and the CLI, with and without the outer (embed, wrap) phases. Their
            # tests need a CUDA driver, which this container lacks, so they are only linted here.
            - name: Clippy host prover and CLI
              run: |
                  set -eux
                  cargo clippy -p pico-prover -p pico-cli --lib --bins --tests \
                    --locked --message-format=short -- -D warnings
                  cargo clippy -p pico-prover -p pico-cli --no-default-features --lib --bins \
                    --tests --locked --message-format=short -- -D warnings

            # The SDK examples' guests and libraries; the provers would rebuild pico-prover in
            # this workspace's own target.
            - name: Examples compile
              run: |
                  set -eux
                  (cd examples && cargo check --workspace --all-targets \
                    --exclude fibonacci-prover --exclude tendermint-prover --exclude aggregator-prover)
                  rm -rf examples/target

    # pico-mle-core compiles no CUDA, so its tests run on the plain runner. They pin every preset's
    # soundness and refuse parameter sets the prover cannot run, under both degree bounds.
    soundness:
        name: GPU · Soundness
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Install Rust
              run: |
                  rustup toolchain install nightly-2026-09-27 --profile minimal
                  rustup override set nightly-2026-09-27
            - name: Soundness calculator, presets and admissibility (default bounds)
              run: |
                  cargo test --release -p pico-mle-core --features test-utils
            - name: Soundness calculator, presets and admissibility (optimized degree bound)
              run: |
                  # `differential_ground_truth_table` is ignored here: its values assume the
                  # closed-form bound.
                  cargo test --release -p pico-mle-core --features test-utils,soundness-bchks25-optimized

    # The launchers' own tests, against a stub nvidia-smi, fake inputs and canned prover logs: no
    # GPU, no build. A wrong card split or a parser that drifted from the prover's headline would
    # otherwise only show up in a real run.
    scripts:
        name: GPU · Launcher script tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
            - name: The sweep CSV path
              run: bash ci/test_sweep_csv.sh
            - name: The sweep launcher
              run: bash ci/test_sweep_launcher.sh
            - name: The two-machine launcher
              run: bash ci/test_two_machine_launcher.sh

    # The gnark half of the EVM path. Nothing else compiles the Go tree, so a reference to a helper
    # deleted on either side of the FFI boundary would land green; the unit tests pin the Poseidon2
    # constants against the Rust ones and read a proof file back. The tests that need a wrap proof
    # (`koalabear_verifier`) skip here: no job on this branch proves one.
    gnark:
        name: GPU · Gnark bindings
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            # field-ffi compiles no CUDA, so the plain runner builds it; cargo still resolves the
            # whole workspace's (public) git dependencies.
            - name: Install Rust
              run: |
                  rustup toolchain install nightly-2026-09-27 --profile minimal
                  rustup override set nightly-2026-09-27
            - name: Compile field ffi so
              run: |
                  cargo build --release --locked --package field-ffi
            - uses: actions/setup-go@v5
              with:
                  go-version-file: gnark/go.mod
                  cache-dependency-path: gnark/go.sum
            - name: Vet and test the Go bindings
              run: |
                  set -eux
                  (cd gnark && go vet ./...)
                  # `-rpath` as well as `-L`: the test binary loads libfield_ffi.so at run time,
                  # and the linker path alone does not survive into the process.
                  (cd gnark && CGO_LDFLAGS="-L$GITHUB_WORKSPACE/target/release -Wl,-rpath,$GITHUB_WORKSPACE/target/release" \
                    go test ./poseidon2/... ./utils/...)

    # The verifier contracts, against the proofs committed in contracts/test/fixtures. Foundry only:
    # nothing here proves.
    contracts:
        name: EVM · Contracts
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: v1.5.1
            - name: forge fmt and test
              working-directory: contracts
              run: |
                  set -eux
                  forge fmt --check
                  forge test -vvv
