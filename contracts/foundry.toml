[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.33"
optimizer = true
optimizer_runs = 200
# The tests read their proofs from here.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[fmt]
# gnark's export, kept byte for byte as the setup wrote it (see test/dev/manifest.json).
ignore = ["test/dev/Groth16Verifier.sol"]
